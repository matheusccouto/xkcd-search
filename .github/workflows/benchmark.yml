name: benchmark

on:
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run retrieval benchmark
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run pytest evals/
