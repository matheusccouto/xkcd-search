name: benchmark

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run retrieval benchmark against"
        required: true
        default: "main"

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run retrieval benchmark
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run pytest evals/
