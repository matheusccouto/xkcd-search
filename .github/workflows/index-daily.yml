name: index-daily

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Ingest and upload LanceDB dataset to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: couto/xkcd
        run: uv run xkcd-ingest

      # Restart HF Space so the live application reloads the updated dataset
      - name: Restart HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          curl -sf -X POST \
            "https://huggingface.co/api/spaces/couto/xkcd-search/restart" \
            -H "Authorization: Bearer $HF_TOKEN"
