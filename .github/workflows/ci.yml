name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint check
        run: uvx ruff check .

      - name: Format check
        run: uvx ruff format --check .

      - name: Type check
        run: uvx ty check

      - name: Run test suite
        run: uv run pytest
