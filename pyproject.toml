[project]
name = "xkcd-search"
version = "0.1.0"
description = "Semantic search for xkcd comics, served over MCP"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Matheus Couto", email = "matheusccouto@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.4",
    "gradio>=6.22.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.27.0",
    "lancedb>=0.38.0",
    "mwparserfromhell>=0.7.2",
]


[project.urls]
Homepage = "https://github.com/matheusccouto/xkcd-search-mcp"
Repository = "https://github.com/matheusccouto/xkcd-search-mcp"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "xkcd_search"

[project.scripts]
xkcd-ingest = "xkcd_search.ingest:main"

[tool.ruff]
exclude = [".agents"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # Incompatible with D211
    "D213",   # Incompatible with D212
    "COM812", # Incompatible with ruff format
    "ISC001", # Incompatible with ruff format
    "CPY001", # Missing copyright notice
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.11",
    "ty>=0.0.31",
]
